[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the serverless function (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
